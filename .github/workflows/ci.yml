name: Enterprise SOC Threat Pipeline CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    name: Test & Coverage (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock pytest-cov flake8 bandit

      - name: Static Security Analysis (SAST - Bandit)
        run: |
          bandit -r src/ -ll -ii

      - name: Linting & Code Hygiene (Flake8)
        run: |
          # 1. Fatal errors: Stop the build if there are Python syntax errors or undefined names
          flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # 2. Style guidelines: Report style statistics against .flake8 config without blocking
          flake8 src/ tests/ --count --statistics --exit-zero

      - name: Execute Test Suite with Coverage Enforcement
        env:
          PYTHONPATH: .
        run: |
          pytest -m pytest --cov=src --cov-report=term-missing -v

  container:
    name: Container Build Verification
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: soc-threat-pipeline:latest
